<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="A cute cartoon sticker of a person with hair buns and headphones coding on a laptop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/>
      <feFlood flood-color="#F7F3EA" result="f"/>
      <feComposite in="f" in2="d" operator="in" result="border"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d2"/>
      <feFlood flood-color="#2B2620" flood-opacity="0.35" result="f2"/>
      <feComposite in="f2" in2="d2" operator="in" result="outer"/>
      <feMerge><feMergeNode in="outer"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#cut)" stroke="#2B2620" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- desk -->
    <rect x="18" y="110" width="114" height="9" rx="2" fill="#8D5424"/>

    <!-- pencil pot -->
    <rect x="24" y="92" width="14" height="18" rx="2" fill="#E9B44C"/>
    <path d="M28 92 V80 M32 92 V78 M36 92 V82" stroke="#3A5470" stroke-width="3"/>
    <path d="M28 80 l0 -3 M32 78 l0 -3" stroke="#D9534F" stroke-width="3"/>

    <!-- cup -->
    <path d="M112 96 h14 v11 a7 7 0 0 1 -14 0 Z" fill="#F7F3EA"/>
    <path d="M126 99 h4 a3.5 3.5 0 0 1 0 7 h-4" fill="none"/>
    <path d="M116 91 q2 -3 0 -6 M121 91 q2 -3 0 -6" fill="none" stroke-width="1.8" opacity="0.7"/>

    <!-- body / top -->
    <path d="M46 110 Q46 84 62 80 H88 Q104 84 104 110 Z" fill="#3A5470"/>
    <!-- arms -->
    <path d="M50 96 Q46 104 54 108" fill="none" stroke="#F0C9A8" stroke-width="7"/>
    <path d="M100 96 Q104 104 96 108" fill="none" stroke="#F0C9A8" stroke-width="7"/>
    <path d="M50 96 Q46 104 54 108 M100 96 Q104 104 96 108" fill="none"/>

    <!-- hair buns -->
    <circle cx="50" cy="36" r="9" fill="#2C1E16"/>
    <circle cx="100" cy="36" r="9" fill="#2C1E16"/>

    <!-- head -->
    <circle cx="75" cy="56" r="23" fill="#F0C9A8"/>
    <!-- hair cap -->
    <path d="M52.5 52 Q54 33 75 32 Q96 33 97.5 52 Q92 44 82 43 Q76 43 70 47 Q62 50 52.5 52 Z" fill="#2C1E16"/>

    <!-- headphones -->
    <path d="M50 58 Q50 30 75 29 Q100 30 100 58" fill="none" stroke-width="3.5"/>
    <rect x="44" y="52" width="10" height="16" rx="4" fill="#E9B44C"/>
    <rect x="96" y="52" width="10" height="16" rx="4" fill="#E9B44C"/>

    <!-- blush -->
    <circle cx="61" cy="65" r="3.5" fill="#F2A7A0" stroke="none" opacity="0.8"/>
    <circle cx="89" cy="65" r="3.5" fill="#F2A7A0" stroke="none" opacity="0.8"/>

    <!-- glasses -->
    <circle cx="66" cy="58" r="7.5" fill="#FFFFFF" fill-opacity="0.35"/>
    <circle cx="84" cy="58" r="7.5" fill="#FFFFFF" fill-opacity="0.35"/>
    <path d="M73.5 58 H76.5" fill="none"/>
    <!-- eyes -->
    <circle cx="66" cy="59" r="2.2" fill="#2B2620" stroke="none"/>
    <circle cx="84" cy="59" r="2.2" fill="#2B2620" stroke="none"/>
    <circle cx="67" cy="58" r="0.7" fill="#FFFFFF" stroke="none"/>
    <circle cx="85" cy="58" r="0.7" fill="#FFFFFF" stroke="none"/>
    <!-- smile -->
    <path d="M71 68 Q75 71 79 68" fill="none" stroke-width="2"/>

    <!-- laptop -->
    <path d="M52 86 H98 L102 112 H48 Z" fill="#E8E4DA"/>
    <path d="M56 90 H94 L97 108 H53 Z" fill="#F7F3EA" stroke="none"/>
    <rect x="42" y="112" width="66" height="7" rx="2" fill="#55606B"/>
    <!-- code -->
    <g stroke-width="3" stroke-linecap="round">
      <path d="M60 95 h6" stroke="#E9B44C"/>
      <path d="M69 95 h14" stroke="#3A5470"/>
      <path d="M60 101 h11" stroke="#8D5424"/>
      <path d="M74 101 h10" stroke="#5B8A6B"/>
      <path d="M60 107 h8" stroke="#3A5470"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#E9B44C" stroke="#2B2620" stroke-width="1.4" stroke-linejoin="round">
    <path d="M118 44 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z"/>
    <path d="M30 60 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 Z"/>
  </g>
</svg>
